name: Unpack project pack

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack financial project files
        run: |
          set -e
          if [ ! -f priyanka-shah-github-project-pack.zip ]; then echo "pack zip not found, nothing to do"; exit 0; fi
          unzip -o priyanka-shah-github-project-pack.zip "financial-reporting-automation/*"
          mv financial-reporting-automation/README.md financial-reporting-automation/requirements.txt .
          mkdir -p data sql python output
          mv financial-reporting-automation/data/* data/
          mv financial-reporting-automation/sql/* sql/
          mv financial-reporting-automation/python/* python/
          mv financial-reporting-automation/output/* output/
          rmdir financial-reporting-automation/data financial-reporting-automation/sql financial-reporting-automation/python financial-reporting-automation/output financial-reporting-automation
          rm -f priyanka-shah-github-project-pack.zip
          rm -f .github/workflows/unpack.yml
          rmdir .github/workflows .github 2>/dev/null || true
          find . -type f | sort
      - name: Commit unpacked files
        run: |
          git config user.name "pshah580-png"
          git config user.email "pshah580-png@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add financial-reporting-automation files with folder structure" || echo "nothing to commit"
          git push
